# =====================================================
#               SEssentials Configuration
# =====================================================
# This file controls the core behavior of SEssentials.
# Reload with: /sessentials reload
# =====================================================

# Master enable switch for the plugin
enabled: true

# Check for updates on startup
check-updates: true

# Global feature toggles
features:
  enabled: true			  # Enable all plugin features
  events: true			  # Enable all plugin events
  commands: true			# Enable all plugin commands

# General plugin settings
settings:
  debug-mode: false
  spawn-on-join: false
  force-respawn: false
  force-gamemode: true
  spawn-permission: false
  default-gamemode: "survival"

# Default messages
messages:
  join: " &8[&a+&8] &f"
  quit: " &8[&c-&8] &f"
  reloaded: "&aSEssentials has been reloaded."
  subcommand-unknown: " &cUnknown subcommand. Try "
  sender-message: " &8[%color%%prefix%&8] &f%name% &8≫"
  permission-denied: "&cYou don't have the required permission to use this command."