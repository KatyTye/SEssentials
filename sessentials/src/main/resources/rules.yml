list:
- "No hacking, cheating, x-ray, or unfair client modifications."
- "Do not use exploits, dupes, or bugs to gain an unfair advantage."
- "No griefing, stealing, or intentionally damaging another player's property."
- "Keep chat respectful. No harassment, hate speech, or personal attacks."
- "No spamming, flooding chat, or excessive caps."
- "Do not advertise other servers or unrelated services without permission."
- "Do not impersonate players, staff, or server owners."
- "Follow staff instructions and report rule-breaking players to staff."
- "Do not evade mutes, bans, or other punishments with alternate accounts."
- "No inappropriate, offensive, or excessively disruptive builds."
- "Do not trap or kill players in ways that abuse server mechanics."
- "Do not lag or crash the server with machines, entities, or other builds."
- "Use shops, claims, and other server features honestly."
- "Do not set traps or misleading trades that scam other players."
- "Keep usernames, skins, and signs appropriate for the server."
- "Have fun, be considerate, and help keep the server welcoming for everyone."